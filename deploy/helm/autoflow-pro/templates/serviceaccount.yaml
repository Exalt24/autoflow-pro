{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autoflow.serviceAccountName" . }}
  labels:
    {{- include "autoflow.labels" . | nindent 4 }}
  {{- $annotations := .Values.serviceAccount.annotations | default dict }}
  {{- if .Values.serviceAccount.irsaRoleArn }}
  {{- $annotations = merge (dict "eks.amazonaws.com/role-arn" .Values.serviceAccount.irsaRoleArn) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
