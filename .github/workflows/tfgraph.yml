name: tfgraph

# The Go tool in deploy/aws/tfgraph: format, vet, tests, the mutation pass, and the tool run on a real
# `terraform plan` of deploy/aws. It is a separate workflow because `paths:` filters a whole workflow, and the
# jobs in ci.yml must keep running on every push. One Linux job, no schedule, nothing here reaches AWS.

on:
  push:
    branches: [main]
    paths:
      - "deploy/aws/**"
      - ".github/workflows/tfgraph.yml"
  pull_request:
    paths:
      - "deploy/aws/**"
      - ".github/workflows/tfgraph.yml"

concurrency:
  group: tfgraph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tfgraph:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-southeast-2
      TF_IN_AUTOMATION: "1"
    defaults:
      run:
        working-directory: deploy/aws/tfgraph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: deploy/aws/tfgraph/go.mod
          cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: go version
      - name: gofmt lists nothing
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Unit, table, golden and fixture tests
        run: |
          go test -count=1 -v ./... > "$RUNNER_TEMP/test.out" 2>&1 || { cat "$RUNNER_TEMP/test.out"; exit 1; }
          grep -E "^ok" "$RUNNER_TEMP/test.out"
          echo "test functions passed: $(grep -c '^--- PASS' "$RUNNER_TEMP/test.out")"
      - name: Mutation pass, every deliberate break must turn a test red
        run: go run ./cmd/mutate
      - name: terraform plan of deploy/aws, then tfgraph check
        run: |
          (cd .. && terraform init -input=false -backend=false -no-color && terraform plan -input=false -no-color -lock=false -state="$RUNNER_TEMP/none.tfstate" -var-file=emulator.tfvars -var bucket_suffix=123456789012 -out="$RUNNER_TEMP/plan.tfplan" && terraform show -json "$RUNNER_TEMP/plan.tfplan" > "$RUNNER_TEMP/plan.json")
          go build -o "$RUNNER_TEMP/tfgraph" ./cmd/tfgraph
          "$RUNNER_TEMP/tfgraph" check "$RUNNER_TEMP/plan.json"
      - name: tfgraph check finds the widened policy and exits 1
        run: |
          go build -o "$RUNNER_TEMP/tfgraph" ./cmd/tfgraph
          code=0
          "$RUNNER_TEMP/tfgraph" check testdata/variants/widened-policy.json || code=$?
          echo "exit code $code"
          test "$code" = 1
