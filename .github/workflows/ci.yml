name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  pipelines:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:pipelines

  aws-emulator:
    # Runs the AWS S3 archive target against a local AWS emulator (moto). GitHub Actions only,
    # because it needs a Redis service and a Terraform install that the other two pipelines do not carry.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUIRE_EMULATOR: "1"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: pip install "moto[server]==5.2.5"
      - run: npm ci
        working-directory: backend
      - name: Provider switch unit tests
        run: npm run test:archive-provider
        working-directory: backend
      - name: Terraform format, validate and plan checks
        run: |
          terraform fmt -check -recursive
          terraform init -input=false -backend=false
          terraform validate
          cd ../../backend && npm run test:aws-terraform
        working-directory: deploy/aws
      - name: Start moto
        run: |
          nohup moto_server -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/moto-api/ && break; sleep 1; done
          curl -sf http://localhost:5000/moto-api/
      - name: Apply, test and destroy against moto
        run: bash deploy/aws/emulator-proof.sh
      - name: moto log
        if: failure()
        run: tail -100 moto.log

  rabbitmq:
    # Runs the RabbitMQ consumer and publisher against a real broker and Redis (service containers).
    # GitHub Actions only, like aws-emulator, because the other two pipelines carry no service containers.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUIRE_RABBITMQ: "1"
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      RABBITMQ_MGMT_URL: http://guest:guest@localhost:15672
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:rabbitmq-logic
      - run: npm run test:rabbitmq

  athena:
    # The Athena client against a stand-in for the Athena API (no AWS account), and the deploy/athena Terraform:
    # fmt, validate, an offline plan and rules on the plan JSON. Nothing here touches AWS.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      REQUIRE_TERRAFORM: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: npm ci
      - run: npm run test:athena-logic
      - run: npm run test:athena
      - run: npm run test:athena-terraform

  telemetry:
    # The telemetry pipeline (backend/src/telemetry): rules, end to end run, a measured load run, the Terraform tables and
    # the worker against a real RabbitMQ broker (service container). Nothing here touches AWS.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      REQUIRE_TERRAFORM: "1"
      REQUIRE_RABBITMQ: "1"
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: npm ci
      - run: npm run test:telemetry-logic
      - run: npm run test:telemetry-e2e
      - run: npm run telemetry:load
      - run: npm run test:telemetry-terraform
      - run: npm run test:telemetry-rabbitmq

  kubernetes:
    # Terraform (deploy/eks) and the Helm chart (deploy/helm): fmt, validate, an offline plan, helm lint and template,
    # kubeconform on the rendered objects, and the rules in scripts/test-deploy-files.ts. Nothing here touches AWS.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      REQUIRE_DEPLOY_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          kubeconform -v
      - run: npm ci
      - run: npm run test:deploy

  temporal:
    # The Temporal run workflow (backend/src/temporal): unit tests on the SDK's time-skipping test server, then the same
    # workflow against a real `temporal server start-dev` process (Temporal CLI 1.10.0), then the GraphQL API driving it.
    # Local dev server only: no Temporal Cloud, no cluster.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      REQUIRE_TEMPORAL: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:temporal
      - name: Start the Temporal dev server
        run: |
          curl -sSfL "https://temporal.download/cli/archive/v1.10.0?platform=linux&arch=amd64" | tar xz -C "$RUNNER_TEMP" temporal
          nohup "$RUNNER_TEMP/temporal" server start-dev --headless --port 7233 --log-level warn > "$RUNNER_TEMP/temporal.log" 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/7233) 2>/dev/null && break; sleep 1; done
          "$RUNNER_TEMP/temporal" --version
      - run: npm run test:temporal-e2e
      - run: npm run test:graphql-temporal
      - name: Temporal dev server log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/temporal.log"

  graphql:
    # The GraphQL API (backend/src/graphql) served in process with a recording launcher. The schema snapshot and the
    # generated types are rebuilt and must match what is committed.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run graphql:schema
      - run: npm run graphql:codegen
      - name: Schema snapshot and generated types are committed
        run: git diff --exit-code -- src/graphql
      - run: npm run test:graphql
      - name: Every mutation target still exists in the code
        run: node ../scripts/mutation-check-services.mjs check

  rust-cli:
    # The Rust CLI (cli/): format, clippy with warnings as errors, unit tests and the tests against a mock GraphQL server.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  nixpacks:
    # A real `nixpacks build` of the backend (Nixpacks 1.41.0), then the image is started next to a Redis container and
    # /health must answer 200. The script starts its own Redis.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nixpacks 1.41.0
        run: curl -sSfL https://github.com/railwayapp/nixpacks/releases/download/v1.41.0/nixpacks-v1.41.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin
      - run: nixpacks --version
      - run: nixpacks build backend --name autoflow-backend-nixpacks
      - name: Start the image and ask /health
        run: bash scripts/nixpacks-check.sh autoflow-backend-nixpacks
