{{- if .Values.worker.enabled }}
{{- $sel := dict "root" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autoflow.fullname" . }}-worker
  labels:
    {{- include "autoflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "autoflow.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autoflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "autoflow.serviceAccountName" . }}
      securityContext:
        {{- include "autoflow.podSecurityContext" . | nindent 8 }}
      # The worker stops taking messages on SIGTERM and waits up to SHUTDOWN_TIMEOUT_MS for running handlers.
      # Kubernetes must wait longer than that before it sends SIGKILL.
      terminationGracePeriodSeconds: {{ add (div (int .Values.config.shutdownTimeoutMs) 1000) 10 }}
      containers:
        - name: worker
          image: {{ include "autoflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/src/messaging/main.js"]
          securityContext:
            {{- include "autoflow.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.worker.healthPort }}
              protocol: TCP
          env:
            - name: HEALTH_PORT
              value: {{ .Values.worker.healthPort | quote }}
            {{- range $key := list "REDIS_URL" "RABBITMQ_URL" }}
            {{- include "autoflow.secretEnv" (dict "root" $ "key" $key) | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "autoflow.fullname" . }}
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
