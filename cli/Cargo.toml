[package]
name = "autoflow-cli"
version = "0.1.0"
edition = "2021"
description = "Command line client for the AutoFlow Pro GraphQL API"
license = "MIT"

[[bin]]
name = "autoflow-cli"
path = "src/main.rs"

[lib]
name = "autoflow_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros", "time"] }
wiremock = "0.6.5"
