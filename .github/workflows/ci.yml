name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  pipelines:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:pipelines

  aws-emulator:
    # Runs the AWS S3 archive target against a local AWS emulator (moto). GitHub Actions only,
    # because it needs a Redis service and a Terraform install that the other two pipelines do not carry.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUIRE_EMULATOR: "1"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: pip install "moto[server]==5.2.5"
      - run: npm ci
        working-directory: backend
      - name: Provider switch unit tests
        run: npm run test:archive-provider
        working-directory: backend
      - name: Terraform format, validate and plan checks
        run: |
          terraform fmt -check -recursive
          terraform init -input=false -backend=false
          terraform validate
          cd ../../backend && npm run test:aws-terraform
        working-directory: deploy/aws
      - name: Start moto
        run: |
          nohup moto_server -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/moto-api/ && break; sleep 1; done
          curl -sf http://localhost:5000/moto-api/
      - name: Apply, test and destroy against moto
        run: bash deploy/aws/emulator-proof.sh
      - name: moto log
        if: failure()
        run: tail -100 moto.log
